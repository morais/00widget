name: Horizon app

# Builds and tests the Horizon OS panel app (hzos/). Path-filtered: the
# server workflow never needs it, and it needs nothing from the server.
# examples/ is included because WireDecodingTest decodes those payloads.
on:
  push:
    branches: [main]
    paths: ["hzos/**", "examples/**", ".github/workflows/hzos.yml"]
  pull_request:
    paths: ["hzos/**", "examples/**", ".github/workflows/hzos.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Layout screenshots render here but are not compared: the committed
      # baselines come from macOS, and font rasterisation differs on Linux.
      # verifyRoborazziDebug stays a local check (see hzos/README.md).
      - name: Assemble, unit test, lint, detekt, formatting
        working-directory: hzos
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:detekt spotlessCheck --console=plain
