name: Horizon app

# Builds and tests the Horizon OS panel app (hzos/). Path-filtered to what
# the app is built from or decodes: examples/ because WireDecodingTest
# decodes those payloads, and server/src/types.ts because it is the wire
# contract those payloads follow. The rest of server/ cannot break it.
on:
  push:
    branches: [main]
    paths: ["hzos/**", "examples/**", "server/src/types.ts", ".github/workflows/hzos.yml"]
  pull_request:
    paths: ["hzos/**", "examples/**", "server/src/types.ts", ".github/workflows/hzos.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Layout screenshots render here but are not compared: the committed
      # baselines come from macOS, and font rasterisation differs on Linux.
      # verifyRoborazziDebug stays a local check (see hzos/README.md).
      - name: Assemble, unit test, lint, detekt
        working-directory: hzos
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:detekt --console=plain

      # Its own invocation, not alongside detekt: both load Kotlin's compiler
      # and analysis internals in the same Gradle JVM, and run in parallel
      # they occasionally collide, failing detekt within milliseconds with
      # only "There was a problem running detekt" (81b976e, passed on re-run).
      - name: Formatting
        working-directory: hzos
        run: ./gradlew spotlessCheck --console=plain

      # The store gets the release variant, which debug never exercises: R8
      # shrinking and obfuscation, resource shrinking, and the keep rules in
      # proguard-rules.pro. A missing keep rule builds a debug APK fine and
      # fails here, or at runtime. Unsigned: CI holds no store keystore, and
      # -PallowUnsigned is how a release build says that is intended.
      - name: Assemble release (R8)
        working-directory: hzos
        run: ./gradlew :app:assembleRelease -PallowUnsigned --console=plain
